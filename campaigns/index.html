<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>캠페인 결과</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #111; }
  body { display: flex; flex-direction: column; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }

  .tabbar {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 10px 14px;
    background: #111;
    overflow-x: auto;
    flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    padding-left: max(14px, env(safe-area-inset-left));
    padding-right: max(14px, env(safe-area-inset-right));
  }
  .tabbar::-webkit-scrollbar { display: none; }

  .tab-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(255,255,255,0.3);
    margin-right: 8px; white-space: nowrap; flex-shrink: 0;
  }

  .tab {
    padding: 7px 16px; border-radius: 20px;
    font-size: 13px; font-weight: 700;
    cursor: pointer; border: none;
    background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5);
    white-space: nowrap; transition: background .15s, color .15s;
    font-family: inherit; flex-shrink: 0;
  }
  .tab:hover { background: rgba(255,255,255,0.18); color: rgba(255,255,255,0.8); }
  .tab.active { background: #fff; color: #111; }

  .frame-wrap { flex: 1; position: relative; overflow: hidden; }
  iframe {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    border: none; background: #fff;
  }
  iframe.hidden { display: none; }
</style>
</head>
<body>

<nav class="tabbar">
  <span class="tab-label">캠페인</span>
  <button class="tab active"  data-id="udaepo">우대포</button>
  <button class="tab" data-id="grikberry">그릭베리</button>
  <button class="tab" data-id="ampleplayground">앰플레이그라운드</button>
  <button class="tab" data-id="loop808">루프808</button>
  <button class="tab" data-id="jinhaeyanabong">진해양봉</button>
  <button class="tab" data-id="chakhangudu">착한구두</button>
</nav>

<div class="frame-wrap">
  <iframe id="frame-udaepo"          src="../udaepo-blogger-2026/"></iframe>
  <iframe id="frame-grikberry"       src="../grikberry-2026/"        class="hidden"></iframe>
  <iframe id="frame-ampleplayground" src="../ampleplayground-2026/"  class="hidden"></iframe>
  <iframe id="frame-loop808"         src="../loop808-2026/"          class="hidden"></iframe>
  <iframe id="frame-jinhaeyanabong"  src="../jinhaeyanabong-2026/"   class="hidden"></iframe>
  <iframe id="frame-chakhangudu"     src="../chakhangudu-2026/"      class="hidden"></iframe>
</div>

<script>
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      const id = tab.dataset.id;
      tabs.forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.frame-wrap iframe').forEach(f => f.classList.add('hidden'));
      tab.classList.add('active');
      document.getElementById('frame-' + id).classList.remove('hidden');
    });
  });
</script>
</body>
</html>
