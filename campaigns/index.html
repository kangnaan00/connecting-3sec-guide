<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>캠페인 결과</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif; }

  .nav {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 4px;
    padding: 10px 14px;
    padding-left: max(14px, env(safe-area-inset-left));
    padding-right: max(14px, env(safe-area-inset-right));
    background: #111;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .nav::-webkit-scrollbar { display: none; }

  .nav-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(255,255,255,0.3);
    margin-right: 6px; white-space: nowrap; flex-shrink: 0;
  }

  .nav a {
    display: block;
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 13px; font-weight: 700;
    color: rgba(255,255,255,0.5);
    background: rgba(255,255,255,0.1);
    text-decoration: none;
    white-space: nowrap; flex-shrink: 0;
    transition: background .15s, color .15s;
  }
  .nav a:hover { background: rgba(255,255,255,0.18); color: rgba(255,255,255,0.8); }

  .brand-section { width: 100%; background: #fff; }
  .brand-section + .brand-section { border-top: 8px solid #111; }

  iframe {
    width: 100%;
    border: none;
    display: block;
    min-height: 400px;
  }
</style>
</head>
<body>

<nav class="nav">
  <span class="nav-label">캠페인</span>
  <a href="#udaepo">우대포</a>
  <a href="#grikberry">그릭베리</a>
  <a href="#ampleplayground">앰플레이그라운드</a>
  <a href="#loop808">루프808</a>
  <a href="#jinhaeyanabong">진해양봉</a>
  <a href="#chakhangudu">착한구두</a>
</nav>

<section class="brand-section" id="udaepo">
  <iframe src="../udaepo-blogger-2026/" scrolling="no" id="f-udaepo"></iframe>
</section>
<section class="brand-section" id="grikberry">
  <iframe src="../grikberry-2026/" scrolling="no" id="f-grikberry"></iframe>
</section>
<section class="brand-section" id="ampleplayground">
  <iframe src="../ampleplayground-2026/" scrolling="no" id="f-ampleplayground"></iframe>
</section>
<section class="brand-section" id="loop808">
  <iframe src="../loop808-2026/" scrolling="no" id="f-loop808"></iframe>
</section>
<section class="brand-section" id="jinhaeyanabong">
  <iframe src="../jinhaeyanabong-2026/" scrolling="no" id="f-jinhaeyanabong"></iframe>
</section>
<section class="brand-section" id="chakhangudu">
  <iframe src="../chakhangudu-2026/" scrolling="no" id="f-chakhangudu"></iframe>
</section>

<script>
  function fitIframe(iframe) {
    try {
      const h = iframe.contentWindow.document.documentElement.scrollHeight;
      if (h > 0) iframe.style.height = h + 'px';
    } catch(e) {}
  }

  document.querySelectorAll('iframe').forEach(function(iframe) {
    iframe.addEventListener('load', function() {
      fitIframe(this);
      // 폰트 로딩 후 재측정
      setTimeout(function() { fitIframe(iframe); }, 600);
    });
  });
</script>
</body>
</html>
