<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>방어 촬영 가이드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d0d;
    --surface: #181818;
    --border: #2a2a2a;
    --fg: #f0ede9;
    --muted: #777;
    --gold: #c8a35a;
    --gold-bg: #1f1a0e;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
    padding: 24px 16px 60px;
    padding-left: max(16px, env(safe-area-inset-left));
    padding-right: max(16px, env(safe-area-inset-right));
  }
  .page { max-width: 480px; margin: 0 auto; }

  /* 비디오 플레이어 */
  .player-wrap {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
    aspect-ratio: 9/16;
    max-height: 56vh;
  }
  video {
    width: 100%; height: 100%; object-fit: cover;
    display: block;
  }
  .shot-label {
    position: absolute; bottom: 14px; left: 14px;
    background: rgba(0,0,0,0.65); backdrop-filter: blur(6px);
    border: 1px solid rgba(200,163,90,0.4);
    border-radius: 8px; padding: 6px 12px;
    font-size: 13px; font-weight: 600; color: var(--gold);
    pointer-events: none;
  }

  /* 헤더 */
  .header { margin: 20px 0 16px; }
  .header .eyebrow { font-size: 11px; font-weight: 600; color: var(--gold); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
  .header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }

  /* 샷 카드 그리드 */
  .shots { display: flex; flex-direction: column; gap: 8px; }
  .shot {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex; align-items: center; gap: 14px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .shot.active {
    border-color: var(--gold);
    background: var(--gold-bg);
  }
  .shot-num {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    background: var(--border); border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--muted);
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .shot.active .shot-num {
    background: var(--gold-bg); border-color: var(--gold); color: var(--gold);
  }
  .shot-info { flex: 1; min-width: 0; }
  .shot-name { font-size: 14px; font-weight: 700; }
  .shot-time { font-size: 11px; color: var(--muted); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .shot-arrow { color: var(--muted); font-size: 16px; flex-shrink: 0; transition: color 0.15s; }
  .shot.active .shot-arrow { color: var(--gold); }
</style>
</head>
<body>
<div class="page">

  <div class="player-wrap">
    <video id="vid" src="guide.mp4" playsinline preload="metadata"></video>
    <div class="shot-label" id="lbl">▶ 샷 선택</div>
  </div>

  <div class="header">
    <div class="eyebrow">루프808 · 방어 필수컷</div>
    <h1>촬영 가이드</h1>
  </div>

  <div class="shots" id="shots">
    <div class="shot" data-start="0" data-end="3" data-label="생 방어 홀 샷">
      <div class="shot-num">1</div>
      <div class="shot-info">
        <div class="shot-name">생 방어 홀 샷</div>
        <div class="shot-time">0:00 – 0:03</div>
      </div>
      <div class="shot-arrow">▶</div>
    </div>
    <div class="shot" data-start="3" data-end="8" data-label="토핑 올리기">
      <div class="shot-num">2</div>
      <div class="shot-info">
        <div class="shot-name">토핑 올리기</div>
        <div class="shot-time">0:03 – 0:08</div>
      </div>
      <div class="shot-arrow">▶</div>
    </div>
    <div class="shot" data-start="8" data-end="14" data-label="완성 플레이팅">
      <div class="shot-num">3</div>
      <div class="shot-info">
        <div class="shot-name">완성 플레이팅</div>
        <div class="shot-time">0:08 – 0:14</div>
      </div>
      <div class="shot-arrow">▶</div>
    </div>
    <div class="shot" data-start="14" data-end="20" data-label="회 클로즈업">
      <div class="shot-num">4</div>
      <div class="shot-info">
        <div class="shot-name">회 클로즈업</div>
        <div class="shot-time">0:14 – 0:20</div>
      </div>
      <div class="shot-arrow">▶</div>
    </div>
    <div class="shot" data-start="20" data-end="26" data-label="방어 김밥">
      <div class="shot-num">5</div>
      <div class="shot-info">
        <div class="shot-name">방어 김밥</div>
        <div class="shot-time">0:20 – 0:26</div>
      </div>
      <div class="shot-arrow">▶</div>
    </div>
    <div class="shot" data-start="26" data-end="33" data-label="젓가락·쌈">
      <div class="shot-num">6</div>
      <div class="shot-info">
        <div class="shot-name">젓가락·쌈 먹기</div>
        <div class="shot-time">0:26 – 0:33</div>
      </div>
      <div class="shot-arrow">▶</div>
    </div>
    <div class="shot" data-start="33" data-end="39" data-label="야외 텐트 공간">
      <div class="shot-num">7</div>
      <div class="shot-info">
        <div class="shot-name">야외 텐트 공간</div>
        <div class="shot-time">0:33 – 0:39</div>
      </div>
      <div class="shot-arrow">▶</div>
    </div>
  </div>

</div>

<script>
  const vid = document.getElementById('vid');
  const lbl = document.getElementById('lbl');
  const shots = document.querySelectorAll('.shot');
  let activeEnd = null;
  let activeEl = null;

  shots.forEach(el => {
    el.addEventListener('click', () => {
      const start = parseFloat(el.dataset.start);
      const end   = parseFloat(el.dataset.end);
      const label = el.dataset.label;

      if (activeEl) activeEl.classList.remove('active');
      el.classList.add('active');
      activeEl = el;
      activeEnd = end;
      lbl.textContent = label;

      vid.currentTime = start;
      vid.play();
    });
  });

  vid.addEventListener('timeupdate', () => {
    if (activeEnd !== null && vid.currentTime >= activeEnd) {
      vid.pause();
    }
  });
</script>
</body>
</html>
