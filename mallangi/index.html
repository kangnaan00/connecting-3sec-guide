// Fixed hi-res canvas – CSS scales it to viewport
const CW=560,CH=680;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const DPR=Math.min(window.devicePixelRatio||1,2);
canvas.width=CW*DPR; canvas.height=CH*DPR;
canvas.style.aspectRatio=`${CW}/${CH}`;
ctx.scale(DPR,DPR);

// ─── spring mesh ───────────────────────────────────────────────────
const GW=20,GH=24;
const rest=[],disp=[],vel=[];
for(let r=0;r<=GH;r++){rest[r]=[];disp[r]=[];vel[r]=[];
  for(let c=0;c<=GW;c++){
    rest[r][c]={x:c/GW*CW,y:r/GH*CH};
    disp[r][c]={x:0,y:0};vel[r][c]={x:0,y:0};
  }
}
function physicsStep(){
  for(let r=0;r<=GH;r++)for(let c=0;c<=GW;c++){
    vel[r][c].x=(vel[r][c].x-disp[r][c].x*.08)*.82;
    vel[r][c].y=(vel[r][c].y-disp[r][c].y*.08)*.82;
    disp[r][c].x+=vel[r][c].x; disp[r][c].y+=vel[r][c].y;
  }
}
function applyForce(mx,my,fx,fy){
  const R2=110*110;
  for(let r=0;r<=GH;r++)for(let c=0;c<=GW;c++){
    const dx=rest[r][c].x-mx,dy=rest[r][c].y-my;
    const w=Math.exp(-(dx*dx+dy*dy)/(2*R2));
    vel[r][c].x+=fx*w*2.4; vel[r][c].y+=fy*w*2.4;
  }
}

// ─── input ────────────────────────────────────────────────────────
let down=false,px=0,py=0;
function getPos(e){
  const r=canvas.getBoundingClientRect();
  const t=e.touches?e.touches[0]:e;
  // scale from CSS pixels to canvas logical pixels
  const sx=CW/r.width, sy=CH/r.height;
  return{x:(t.clientX-r.left)*sx, y:(t.clientY-r.top)*sy};
}
canvas.addEventListener('mousedown',e=>{down=true;const p=getPos(e);px=p.x;py=p.y;});
canvas.addEventListener('mousemove',e=>{if(!down)return;const p=getPos(e);applyForce(p.x,p.y,p.x-px,p.y-py);px=p.x;py=p.y;});
canvas.addEventListener('mouseup',()=>down=false);
canvas.addEventListener('mouseleave',()=>down=false);
canvas.addEventListener('touchstart',e=>{e.preventDefault();down=true;const p=getPos(e);px=p.x;py=p.y;},{passive:false});
canvas.addEventListener('touchmove',e=>{e.preventDefault();if(!down)return;const p=getPos(e);applyForce(p.x,p.y,p.x-px,p.y-py);px=p.x;py=p.y;},{passive:false});
canvas.addEventListener('touchend',()=>down=false);

// ─── affine triangle ──────────────────────────────────────────────
function drawTri(src,sx0,sy0,sx1,sy1,sx2,sy2,tx0,ty0,tx1,ty1,tx2,ty2){
  const det=sx0*(sy1-sy2)+sx1*(sy2-sy0)+sx2*(sy0-sy1);
  if(Math.abs(det)<.01)return;
  ctx.save();
  ctx.beginPath();ctx.moveTo(tx0,ty0);ctx.lineTo(tx1,ty1);ctx.lineTo(tx2,ty2);ctx.closePath();ctx.clip();
  const i=1/det;
  ctx.transform(
    (tx0*(sy1-sy2)+tx1*(sy2-sy0)+tx2*(sy0-sy1))*i,
    (ty0*(sy1-sy2)+ty1*(sy2-sy0)+ty2*(sy0-sy1))*i,
    (tx0*(sx2-sx1)+tx1*(sx0-sx2)+tx2*(sx1-sx0))*i,
    (ty0*(sx2-sx1)+ty1*(sx0-sx2)+ty2*(sx1-sx0))*i,
    (tx0*(sx1*sy2-sx2*sy1)+tx1*(sx2*sy0-sx0*sy2)+tx2*(sx0*sy1-sx1*sy0))*i,
    (ty0*(sx1*sy2-sx2*sy1)+ty1*(sx2*sy0-sx0*sy2)+ty2*(sx0*sy1-sx1*sy0))*i
  );
  ctx.drawImage(src,0,0,CW,CH); ctx.restore();
}
function dp(r,c){return{x:rest[r][c].x+disp[r][c].x,y:rest[r][c].y+disp[r][c].y};}
function drawMesh(src){
  for(let r=0;r<GH;r++)for(let c=0;c<GW;c++){
    const a=rest[r][c],A=dp(r,c),b=rest[r][c+1],B=dp(r,c+1);
    const d=rest[r+1][c],D=dp(r+1,c),e=rest[r+1][c+1],E=dp(r+1,c+1);
    drawTri(src,a.x,a.y,b.x,b.y,d.x,d.y,A.x,A.y,B.x,B.y,D.x,D.y);
    drawTri(src,b.x,b.y,e.x,e.y,d.x,d.y,B.x,B.y,E.x,E.y,D.x,D.y);
  }
}

// ─── decorations ─────────────────────────────────────────────────
let T=0;
function blush(x,y){
  const g=ctx.createRadialGradient(x,y,0,x,y,46);
  g.addColorStop(0,'rgba(255,100,140,.36)');g.addColorStop(1,'rgba(255,100,140,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.ellipse(x,y,46,28,0,0,Math.PI*2);ctx.fill();
}
function sparkle(x,y,ph){
  const a=.38+.38*Math.sin(T*2+ph),s=12+5*Math.sin(T+ph);
  ctx.save();ctx.translate(x,y);ctx.rotate(T*.4+ph);ctx.globalAlpha=a;ctx.fillStyle='#e060a0';
  for(let i=0;i<4;i++){ctx.save();ctx.rotate(i*Math.PI/2);ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*.15,-s*.15);ctx.lineTo(s*.5,0);ctx.lineTo(s*.15,s*.15);ctx.lineTo(0,s);ctx.lineTo(-s*.15,s*.15);ctx.lineTo(-s*.5,0);ctx.lineTo(-s*.15,-s*.15);ctx.closePath();ctx.fill();ctx.restore();}
  ctx.restore();
}

// ─── face-shape mask (real face bezier, not oval) ─────────────────
// Tuned for this specific photo (Korean female, slightly narrow forehead,
// prominent cheekbones, defined jawline, pointed chin)
function buildFaceMask(){
  const mc=new OffscreenCanvas(CW,CH).getContext('2d');
  const cx=CW*.50;
  // Y landmarks
  const fhY =CH*.08;   // forehead top
  const ckY =CH*.47;   // cheekbone (widest)
  const jwY =CH*.74;   // jaw
  const cnY =CH*.88;   // chin tip
  // X half-widths at each landmark
  const fhW =CW*.21;   // forehead half-width (narrower)
  const ckW =CW*.34;   // cheek half-width (widest point)
  const jwW =CW*.21;   // jaw half-width
  const cnW =CW*.03;   // chin half-width (very narrow / pointed)

  mc.fillStyle='#fff';
  mc.beginPath();
  mc.moveTo(cx, fhY);  // top center

  // ── RIGHT side ──
  // forehead → cheek
  mc.bezierCurveTo(cx+fhW*1.35, fhY,        cx+ckW*1.1,  ckY*.55,    cx+ckW, ckY);
  // cheek → jaw
  mc.bezierCurveTo(cx+ckW*.9,   ckY*1.35,   cx+jwW*1.1,  jwY,        cx+jwW, jwY);
  // jaw → chin
  mc.bezierCurveTo(cx+jwW*.8,   (jwY+cnY)*.65+cnY*.35, cx+cnW*2.5, cnY-.01*CH, cx+cnW, cnY);
  // chin bottom
  mc.bezierCurveTo(cx+cnW*.3,   cnY+CH*.015, cx-cnW*.3,  cnY+CH*.015, cx-cnW, cnY);
  // ── LEFT side (mirror) ──
  mc.bezierCurveTo(cx-cnW*2.5,  cnY-.01*CH,  cx-jwW*.8,  (jwY+cnY)*.65+cnY*.35, cx-jwW, jwY);
  mc.bezierCurveTo(cx-ckW*.9,   ckY*1.35,    cx-ckW*1.1, ckY*.55,    cx-ckW, ckY);
  mc.bezierCurveTo(cx-fhW*1.35, fhY,         cx-fhW,     fhY*.7,     cx, fhY);
  mc.closePath();
  mc.fill();

  // Feather edges with a tight box blur (R=9px only – keep shape visible)
  const id=mc.getImageData(0,0,CW,CH), d=id.data;
  const a=new Float32Array(CW*CH);
  for(let k=0;k<CW*CH;k++) a[k]=d[k*4+3]/255;
  const tmp=new Float32Array(CW*CH);
  const R=9;
  // horizontal pass
  for(let y=0;y<CH;y++){
    let s=0,cnt=0;
    for(let dx=0;dx<=R&&dx<CW;dx++){s+=a[y*CW+dx];cnt++;}
    for(let x=0;x<CW;x++){
      tmp[y*CW+x]=s/cnt;
      if(x+R+1<CW){s+=a[y*CW+x+R+1];cnt++;}
      if(x-R>=0)  {s-=a[y*CW+x-R];  cnt--;}
    }
  }
  // vertical pass
  for(let x=0;x<CW;x++){
    let s=0,cnt=0;
    for(let dy=0;dy<=R&&dy<CH;dy++){s+=tmp[dy*CW+x];cnt++;}
    for(let y=0;y<CH;y++){
      d[y*CW*4+x*4+3]=Math.min(255,Math.round(s/cnt*255));
      if(y+R+1<CH){s+=tmp[(y+R+1)*CW+x];cnt++;}
      if(y-R>=0)  {s-=tmp[(y-R)*CW+x];  cnt--;}
    }
  }
  mc.putImageData(id,0,0);
  return mc.canvas;
}

// ─── load image + apply face mask ────────────────────────────────
let face=null;
const img=new Image();
img.onload=()=>{
  const iW=img.naturalWidth, iH=img.naturalHeight;
  // Crop to face region: x 80→530 (450px), y 0→480 (59% of height)
  const off=new OffscreenCanvas(CW,CH);
  const oc=off.getContext('2d');
  oc.drawImage(img, 80, 0, 450, iH*.59, 0, 0, CW, CH);

  // Apply face-shape mask
  const mask=buildFaceMask();
  oc.globalCompositeOperation='destination-in';
  oc.drawImage(mask,0,0,CW,CH);

  face=off;
  requestAnimationFrame(loop);
};
img.src=SRC;

// ─── loop ────────────────────────────────────────────────────────
function loop(){
  physicsStep(); T+=.033;
  ctx.clearRect(0,0,CW,CH);
  if(face) drawMesh(face);
  blush(CW*.26, CH*.56); blush(CW*.74, CH*.56);
  sparkle(CW*.07,CH*.07,0); sparkle(CW*.91,CH*.10,1.4);
  sparkle(CW*.05,CH*.78,2.1); sparkle(CW*.94,CH*.82,.9);
  ctx.save();
  const hs=20+6*Math.sin(T*2.5);
  ctx.font=`bold ${Math.round(hs)}px sans-serif`;
  ctx.globalAlpha=.8; ctx.fillText('♥',CW*.84,CH*.07);
  ctx.restore();
  requestAnimationFrame(loop);
}
</script>
