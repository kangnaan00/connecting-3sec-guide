<!doctype html>

<title>크림라벨 촬영 리스트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap">
<style>
  :root { --c: #E84B8E; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #fff; color: #111;
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    font-size: 15px;
    padding-inline: max(20px, env(safe-area-inset-left,0px)) max(20px, env(safe-area-inset-right,0px));
    padding-block: 40px 64px;
  }
  .wrap { max-width: 600px; margin-inline: auto; }
  .brand {
    font-size: clamp(32px, 10vw, 60px);
    font-weight: 700; letter-spacing: -0.02em;
    color: var(--c); line-height: 1; margin-bottom: 6px;
  }
  .tagline { font-size: 13px; font-weight: 600; color: #777; margin-bottom: 32px; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .item {
    display: flex; align-items: center; justify-content: space-between;
    border: 2px solid #111; border-radius: 8px;
    padding: 16px 18px; gap: 12px;
  }
  .id { font-size: 16px; font-weight: 700; }
  .link a {
    font-size: 12px; color: #999; text-decoration: none;
    word-break: break-all;
  }
  .link a:hover { color: var(--c); }
  .num {
    font-size: 22px; font-weight: 700; color: #ddd;
    flex-shrink: 0; min-width: 28px; text-align: right;
  }
</style>
</head>
