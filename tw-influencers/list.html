<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connecting 台灣網紅名單</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');

  :root {
    --bg: #f7f6f4;
    --bg2: #ffffff;
    --fg: #1a1a1a;
    --fg2: #5a5a5a;
    --fg3: #999;
    --border: #e4e2de;
    --accent: #e05a6e;
    --accent-soft: #fdf0f2;
    --badge-bg: #edf0f5;
    --badge-fg: #4a5568;
    --nego-bg: #fff4e5;
    --nego-fg: #c17b00;
    --header-bg: #1c1c22;
    --header-fg: #f0ece4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171c; --bg2: #22222a; --fg: #f0ece4; --fg2: #aaa8a0; --fg3: #666;
      --border: #2e2e38; --accent: #f07080; --accent-soft: #2a1820;
      --badge-bg: #2a2a35; --badge-fg: #b0b8cc;
      --nego-bg: #2a2010; --nego-fg: #e8a030;
      --header-bg: #111115; --header-fg: #f0ece4;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171c; --bg2: #22222a; --fg: #f0ece4; --fg2: #aaa8a0; --fg3: #666;
    --border: #2e2e38; --accent: #f07080; --accent-soft: #2a1820;
    --badge-bg: #2a2a35; --badge-fg: #b0b8cc;
    --nego-bg: #2a2010; --nego-fg: #e8a030;
    --header-bg: #111115; --header-fg: #f0ece4;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    background: var(--bg); color: var(--fg);
    font-size: 14px; line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
  }

  .page-header {
    background: var(--header-bg); color: var(--header-fg);
    padding: 20px max(24px, env(safe-area-inset-left, 0px)) 18px;
    margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  .page-header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .page-header .sub { font-size: 12px; color: #888; }
  .page-header .dot { color: var(--accent); font-weight: 700; }

  .controls {
    padding: 14px 0 10px;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .count { font-size: 12px; color: var(--fg3); }

  .table-wrap { overflow-x: auto; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 0 max(16px, env(safe-area-inset-left, 0px)) 48px; }

  table { width: 100%; border-collapse: collapse; min-width: 480px; }
  thead th {
    background: var(--bg2); border-bottom: 2px solid var(--border);
    padding: 10px 12px; text-align: left;
    font-size: 11px; font-weight: 600; color: var(--fg3);
    letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap;
  }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:hover { background: var(--bg2); }
  tbody td { padding: 12px 12px; vertical-align: top; }

  thead th.right { text-align: right; }
  tbody td.right { text-align: right; font-variant-numeric: tabular-nums; }
  .acct-name a { font-weight: 600; color: var(--fg); text-decoration: none; font-size: 13px; }
  .acct-name a:hover { color: var(--accent); }

  .desc { font-size: 12px; color: var(--fg2); max-width: 320px; line-height: 1.4; }
  .ref-link { font-size: 11px; color: var(--fg3); margin-top: 3px; }
  .ref-link a { color: var(--accent); text-decoration: none; }
  .ref-link a:hover { text-decoration: underline; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .tag {
    background: var(--badge-bg); color: var(--badge-fg);
    padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 500;
  }
  .tag.fit { background: var(--accent-soft); color: var(--accent); }

  .cpv-val { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cpv-low { color: #2dab72; }
  .cpv-mid { color: #f0a030; }
  .cpv-high { color: #e05a6e; }
  .cpv-sub { font-size: 11px; color: var(--fg3); margin-top: 1px; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .cpv-low { color: #3dd88a; }
    :root:not([data-theme="light"]) .cpv-mid { color: #f5b84a; }
    :root:not([data-theme="light"]) .cpv-high { color: #f07080; }
  }
  .scpv { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--fg2); }
  .status-nego {
    display: inline-block; background: var(--nego-bg); color: var(--nego-fg);
    padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600;
  }
  .updated { font-size: 11px; color: var(--fg3); padding-bottom: 24px; }
</style>
</head>
<body>

<div class="page-header">
  <h1>Connecting<span class="dot"> · </span>台灣網紅名單</h1>
  <span class="sub">2026-10</span>
</div>

<div class="controls">
  <span class="count">9位</span>
</div>

<div class="table-wrap">
  <table id="tbl">
    <thead>
      <tr>
        <th>帳號</th>
        <th>內容說明</th>
        <th class="right">CPV</th>
        <th class="right">儲存/分享 CPV</th>
        <th>狀態</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<div class="updated">Connecting · 台灣網紅名單 · 2026-10</div>

<script>
const dataExisting = [
  {
    handle: 'awei_chen_',
    url: 'https://www.instagram.com/awei_chen_/reels/',
    desc: '台灣大學生，分享戀愛觀與生活想法的內容',
    tags: ['戀愛觀', '曖昧', '聊天', '情境劇', '高契合'],
    cpv: 0.6, scpv: 22, nego: true,
  },
  {
    handle: '_yk_yuan',
    url: 'https://www.instagram.com/_yk_yuan/',
    desc: '韓國旅遊內容，露臉出鏡、口條佳，適合 Connecting 宣傳',
    tags: ['韓國旅遊', '線下出鏡', '2M', '高契合'],
    cpv: 5.3, scpv: 1014, nego: false,
  },
  {
    handle: 'christines_talk',
    url: 'https://www.instagram.com/christines_talk/reels/',
    desc: '女性美妝·時尚·煩惱解決，自動回覆設定等實用內容',
    tags: ['美妝', '時尚', '煩惱解決', '高契合'],
    cpv: 12.2, scpv: 477, nego: true,
  },
  {
    handle: 'j_an0808',
    url: 'https://www.instagram.com/j_an0808/reels/',
    desc: '韓國旅遊·Olive Young·聖水購物內容',
    refs: [{label:'韓國旅遊 Reels', url:'https://www.instagram.com/reel/DdWjdOPTB0u/'}],
    tags: ['韓國旅遊', 'Olive Young', '聖水'],
    cpv: 8.4, scpv: 611, nego: true,
  },
  {
    handle: 'chien_0100',
    url: 'https://www.instagram.com/chien_0100/reels/',
    desc: '擅長情境劇·演出類內容',
    refs: [{label:'情境劇 Reels', url:'https://www.instagram.com/reel/DaHoV1PSlDK/'}],
    tags: ['1M', '情境劇', '演出'],
    cpv: 17.6, scpv: 531, nego: true,
  },
  {
    handle: 'kye_88.11.10',
    url: 'https://www.instagram.com/kye_88.11.10/reels/',
    desc: '韓國時尚·美妝推薦內容',
    refs: [{label:'韓國時尚 Reels', url:'https://www.instagram.com/reel/DcYMxLeBN8Z/'}],
    tags: ['韓國時尚', '美妝'],
    cpv: 16.8, scpv: 2547, nego: true,
  },
];

const dataNew = [
  {
    handle: '_seas11',
    url: 'https://www.instagram.com/_seas11/reels/',
    desc: '在韓國工作第2年的台灣女性上班族。韓國日常·購物·追星資訊。可用韓語溝通。擅長提供韓國生活實用資訊',
    refs: [
      {label:'韓國求職·簽證指南', url:'https://www.instagram.com/_seas11/reel/Dc-7XOZizKU/'},
      {label:'弘大換錢資訊', url:'https://www.instagram.com/_seas11/reel/DZ7P9AkCXlf/'},
    ],
    tags: ['居住韓國', '韓語溝通', '上班族', '韓國資訊'],
    cpv: 11.4, scpv: 1327, nego: true,
  },
  {
    handle: 'mxuannc',
    url: 'https://www.instagram.com/mxuannc/reels/',
    desc: '國立台灣大學心理學系，心理學為基礎的聊天內容 + Connecting App 宣傳適合。有 Ping! App 廣告經驗（最高觀看 349.8萬）',
    refs: [
      {label:'Ping! 廣告第1名', url:'https://www.instagram.com/reel/DcTLwAZlb-H/'},
      {label:'Ping! 廣告第2名', url:'https://www.instagram.com/reel/Ddn8yvZnAjX/'},
    ],
    tags: ['心理學', 'Ping廣告經驗', '聊天', '高契合'],
    cpv: 5.4, scpv: 981, nego: true,
  },
  {
    handle: 'ian.black_',
    url: 'https://www.instagram.com/ian.black_/reels/',
    desc: '以學校·教室為主題的短喜劇情境劇。腳本可用英文·台語（語言確認中）',
    refs: [
      {label:'情境劇 Reels', url:'https://www.instagram.com/ian.black_/reel/DcqCRpMz4Ew/'},
      {label:'App廣告 Flixseek', url:'https://www.instagram.com/reel/DYJy-56zwsc/'},
      {label:'App廣告手機遊戲', url:'https://www.instagram.com/reel/Db29XNvToqM/'},
    ],
    tags: ['情境劇', '喜劇', 'App廣告經驗'],
    cpv: 6.2, scpv: 228, nego: true,
  },
];

function cpvClass(v) {
  if (v <= 3) return 'cpv-low';
  if (v <= 8) return 'cpv-mid';
  return 'cpv-high';
}

function rowHtml(d) {
  return `<tr>
    <td><div class="acct-name"><a href="${d.url}" target="_blank" rel="noopener">@${d.handle}</a></div></td>
    <td>
      <div class="desc">${d.desc}</div>
      ${(d.refs||[]).map(r=>`<div class="ref-link">${r.label}: <a href="${r.url}" target="_blank" rel="noopener">링크</a></div>`).join('')}
      ${(d.tags||[]).length ? `<div class="tags">${d.tags.map(t=>`<span class="tag${t==='핏 우수'?' fit':''}">${t}</span>`).join('')}</div>` : ''}
    </td>
    <td class="right"><div class="cpv-val ${cpvClass(d.cpv)}">${d.cpv}원</div><div class="cpv-sub">/ 觀看</div></td>
    <td class="right"><div class="scpv">${d.scpv.toLocaleString()}원</div><div class="cpv-sub">/ 儲存·分享</div></td>
    <td>${d.nego ? '<span class="status-nego">議價中</span>' : ''}</td>
  </tr>`;
}

function groupHeader(label, count) {
  return `<tr><td colspan="5" style="padding:7px 10px;background:var(--badge-bg);color:var(--badge-fg);font-size:11px;font-weight:700;letter-spacing:.04em;border-top:2px solid var(--border);">${label} · ${count}명</td></tr>`;
}

document.getElementById('tbody').innerHTML =
  groupHeader('既有溝通人員', dataExisting.length) +
  dataExisting.map(rowHtml).join('') +
  groupHeader('確認人員', dataNew.length) +
  dataNew.map(rowHtml).join('');
</script>
</body>
</html>
