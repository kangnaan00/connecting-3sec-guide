<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connecting 대만 인플루언서</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');

  /* Layout: compact sortable table dashboard with CPV color scale */
  :root {
    --bg: #f7f6f4;
    --bg2: #ffffff;
    --fg: #1a1a1a;
    --fg2: #5a5a5a;
    --fg3: #999;
    --border: #e4e2de;
    --accent: #e05a6e;
    --accent-soft: #fdf0f2;
    --cpv-low: #2dab72;
    --cpv-mid: #f0a030;
    --cpv-high: #e05a6e;
    --badge-bg: #edf0f5;
    --badge-fg: #4a5568;
    --nego-bg: #fff4e5;
    --nego-fg: #c17b00;
    --header-bg: #1c1c22;
    --header-fg: #f0ece4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171c;
      --bg2: #22222a;
      --fg: #f0ece4;
      --fg2: #aaa8a0;
      --fg3: #666;
      --border: #2e2e38;
      --accent: #f07080;
      --accent-soft: #2a1820;
      --cpv-low: #3dd88a;
      --cpv-mid: #f5b84a;
      --cpv-high: #f07080;
      --badge-bg: #2a2a35;
      --badge-fg: #b0b8cc;
      --nego-bg: #2a2010;
      --nego-fg: #e8a030;
      --header-bg: #111115;
      --header-fg: #f0ece4;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171c;
    --bg2: #22222a;
    --fg: #f0ece4;
    --fg2: #aaa8a0;
    --fg3: #666;
    --border: #2e2e38;
    --accent: #f07080;
    --accent-soft: #2a1820;
    --cpv-low: #3dd88a;
    --cpv-mid: #f5b84a;
    --cpv-high: #f07080;
    --badge-bg: #2a2a35;
    --badge-fg: #b0b8cc;
    --nego-bg: #2a2010;
    --nego-fg: #e8a030;
    --header-bg: #111115;
    --header-fg: #f0ece4;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    background: var(--bg);
    color: var(--fg);
    font-size: 14px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0;
  }

  /* Header */
  .page-header {
    background: var(--header-bg);
    color: var(--header-fg);
    padding: 20px max(24px, env(safe-area-inset-left, 0px)) 18px;
    margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  .page-header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .page-header .sub { font-size: 12px; color: #888; }
  .page-header .dot { color: var(--accent); font-weight: 700; }

  /* Controls */
  .controls {
    padding: 14px 0 10px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .sort-btn {
    background: var(--bg2);
    border: 1px solid var(--border);
    color: var(--fg2);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .sort-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sort-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .count { font-size: 12px; color: var(--fg3); margin-left: auto; }

  /* Table wrapper */
  .table-wrap { overflow-x: auto; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 0 max(16px, env(safe-area-inset-left, 0px)) 32px; }

  table { width: 100%; border-collapse: collapse; min-width: 720px; }
  thead th {
    background: var(--bg2);
    border-bottom: 2px solid var(--border);
    padding: 10px 12px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--fg3);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  thead th.right { text-align: right; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:hover { background: var(--bg2); }
  tbody td { padding: 12px 12px; vertical-align: top; }
  tbody td.right { text-align: right; font-variant-numeric: tabular-nums; }

  /* Account cell */
  .acct-wrap { display: flex; flex-direction: column; gap: 3px; }
  .acct-name a {
    font-weight: 600;
    color: var(--fg);
    text-decoration: none;
    font-size: 13px;
  }
  .acct-name a:hover { color: var(--accent); }
  .price-tag { font-size: 11px; color: var(--fg3); font-variant-numeric: tabular-nums; }

  /* Description */
  .desc { font-size: 12px; color: var(--fg2); max-width: 260px; line-height: 1.4; }
  .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .tag {
    background: var(--badge-bg);
    color: var(--badge-fg);
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 500;
  }
  .tag.fit { background: var(--accent-soft); color: var(--accent); }

  /* CPV cell */
  .cpv-val {
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .cpv-low { color: var(--cpv-low); }
  .cpv-mid { color: var(--cpv-mid); }
  .cpv-high { color: var(--cpv-high); }
  .cpv-sub { font-size: 11px; color: var(--fg3); margin-top: 1px; }

  /* Save/share CPV */
  .scpv { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--fg2); }

  /* Status */
  .status-nego {
    display: inline-block;
    background: var(--nego-bg);
    color: var(--nego-fg);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
  }

  /* Legend */
  .legend {
    display: flex;
    gap: 16px;
    font-size: 11px;
    color: var(--fg3);
    padding-bottom: 10px;
    flex-wrap: wrap;
  }
  .legend-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
  }
  .updated { font-size: 11px; color: var(--fg3); padding-bottom: 24px; }
</style>
</head>
<body>

<div class="page-header">
  <h1>Connecting<span class="dot"> · </span>대만 인플루언서 명단</h1>
  <span class="sub">CPV 기준 정렬 · 2026-10</span>
</div>

<div class="controls">
  <button class="sort-btn active" onclick="sortBy('cpv')">CPV 낮은순</button>
  <button class="sort-btn" onclick="sortBy('scpv')">저장공유CPV 낮은순</button>
  <button class="sort-btn" onclick="sortBy('price')">금액 낮은순</button>
  <span class="count" id="count">8명</span>
</div>

<div class="legend">
  <span><span class="legend-dot" style="background:var(--cpv-low)"></span>CPV ≤ 3원 (우수)</span>
  <span><span class="legend-dot" style="background:var(--cpv-mid)"></span>CPV 3–8원 (보통)</span>
  <span><span class="legend-dot" style="background:var(--cpv-high)"></span>CPV 8원↑ (고단가)</span>
</div>

<div class="table-wrap">
  <table id="tbl">
    <thead>
      <tr>
        <th>계정</th>
        <th>콘텐츠 설명</th>
        <th class="right">금액(KRW)</th>
        <th class="right">CPV</th>
        <th class="right">저장/공유 CPV</th>
        <th>상태</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<div class="updated">※ CPV 단위: 원 | 저장/공유 CPV 단위: 원</div>

<script>
const dataExisting = [
  {
    handle: 'awei_chen_',
    url: 'https://www.instagram.com/awei_chen_/reels/',
    price: 138190,
    desc: '대만 대학생, 생각을 말하는 콘텐츠',
    tags: ['연애관', '썸', '토크', '상황극', '핏 우수'],
    cpv: 0.6,
    scpv: 22,
    nego: true,
  },
  {
    handle: '_yk_yuan',
    url: 'https://www.instagram.com/_yk_yuan/',
    price: 2000000,
    desc: '한국여행 오프라인·얼굴 등장, 말 잘해 커넥팅 소구 적합',
    tags: ['한국여행', '오프라인', '2M', '핏 우수'],
    cpv: 5.3,
    scpv: 1014,
    nego: false,
  },
  {
    handle: 'christines_talk',
    url: 'https://www.instagram.com/christines_talk/reels/',
    price: 700000,
    desc: '여성 메이크업·패션·뷰티 고민 리뷰, 자동응답 설정 등 고민해결',
    tags: ['뷰티', '패션', '고민해결', '핏 우수'],
    cpv: 12.2,
    scpv: 477,
    nego: true,
  },
  {
    handle: 'j_an0808',
    url: 'https://www.instagram.com/j_an0808/reels/',
    price: 1500000,
    desc: '한국 여행·올리브영·성수 쇼핑 콘텐츠',
    refs: [{label:'한국여행 릴스', url:'https://www.instagram.com/reel/DdWjdOPTB0u/'}],
    tags: ['한국여행', '올리브영', '성수'],
    cpv: 8.4,
    scpv: 611,
    nego: true,
  },
  {
    handle: 'chien_0100',
    url: 'https://www.instagram.com/chien_0100/reels/',
    price: 1000000,
    desc: '상황극·연출 콘텐츠 잘함',
    refs: [{label:'상황극 릴스', url:'https://www.instagram.com/reel/DaHoV1PSlDK/'}],
    tags: ['1M', '상황극', '연출'],
    cpv: 17.6,
    scpv: 531,
    nego: true,
  },
  {
    handle: 'kye_88.11.10',
    url: 'https://www.instagram.com/kye_88.11.10/reels/',
    price: 1500000,
    desc: '한국 패션·뷰티 추천 콘텐츠',
    refs: [{label:'한국패션 릴스', url:'https://www.instagram.com/reel/DcYMxLeBN8Z/'}],
    tags: ['한국패션', '뷰티'],
    cpv: 16.8,
    scpv: 2547,
    nego: true,
  },
];

const dataNew = [
  {
    handle: 'mxuannc',
    url: 'https://www.instagram.com/mxuannc/reels/',
    price: 335000,
    desc: '국립대만대 심리학과, 심리학 기반 토크 + 커넥팅앱 소구. Ping! 앱 광고 경험 (최고조회 349.8만)',
    refs: [
      {label:'Ping! 광고 1위', url:'https://www.instagram.com/reel/DcTLwAZlb-H/'},
      {label:'Ping! 광고 2위', url:'https://www.instagram.com/reel/Ddn8yvZnAjX/'},
    ],
    tags: ['심리학', 'Ping광고경험', '토크', '핏 우수'],
    cpv: 5.4,
    scpv: 981,
    nego: true,
  },
  {
    handle: 'ian.black_',
    url: 'https://www.instagram.com/ian.black_/reels/',
    price: 800000,
    desc: '학교·교실 주제 짧은 개그 상황극. 스크립트 영어·대만어 가능 (언어확인중)',
    refs: [
      {label:'상황극 릴스', url:'https://www.instagram.com/ian.black_/reel/DcqCRpMz4Ew/'},
      {label:'앱광고 Flixseek', url:'https://www.instagram.com/reel/DYJy-56zwsc/'},
      {label:'앱광고 모바일게임', url:'https://www.instagram.com/reel/Db29XNvToqM/'},
    ],
    tags: ['상황극', '개그', '앱광고경험'],
    cpv: 6.2,
    scpv: 228,
    nego: true,
  },
];

function fmtPrice(n) {
  if (!n) return '—';
  if (n >= 10000) return Math.round(n/10000) + '만원';
  return n.toLocaleString() + '원';
}

function cpvClass(v) {
  if (v <= 3) return 'cpv-low';
  if (v <= 8) return 'cpv-mid';
  return 'cpv-high';
}

function rowHtml(d) {
  return `<tr>
    <td>
      <div class="acct-wrap">
        <div class="acct-name"><a href="${d.url}" target="_blank" rel="noopener">@${d.handle}</a></div>
        <div class="price-tag">견적 ${fmtPrice(d.price)}</div>
      </div>
    </td>
    <td>
      <div class="desc">${d.desc}</div>
      ${(d.refs||[]).map(r=>`<div class="cpv-sub" style="margin-top:4px">${r.label}: <a href="${r.url}" target="_blank" rel="noopener" style="color:var(--accent)">링크</a></div>`).join('')}
      ${d.tags.length ? `<div class="tags">${d.tags.map(t=>`<span class="tag${t==='핏 우수'?' fit':''}">${t}</span>`).join('')}</div>` : ''}
    </td>
    <td class="right"><div class="scpv">${d.price ? d.price.toLocaleString()+'원' : '—'}</div></td>
    <td class="right"><div class="cpv-val ${cpvClass(d.cpv)}">${d.cpv}원</div><div class="cpv-sub">/ 조회</div></td>
    <td class="right"><div class="scpv">${d.scpv.toLocaleString()}원</div><div class="cpv-sub">/ 저장·공유</div></td>
    <td>${d.nego ? '<span class="status-nego">협상중</span>' : ''}</td>
  </tr>`;
}

function groupHeader(label, count) {
  return `<tr><td colspan="6" style="padding:7px 10px;background:var(--badge-bg);color:var(--badge-fg);font-size:11px;font-weight:700;letter-spacing:.04em;border-top:2px solid var(--border);">${label} · ${count}명</td></tr>`;
}

function render(existing, newOnes) {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML =
    groupHeader('기존 소통 인원', existing.length) +
    existing.map(rowHtml).join('') +
    groupHeader('컨펌 인원', newOnes.length) +
    newOnes.map(rowHtml).join('');
}

let sortKey = 'cpv';
function sortBy(key) {
  sortKey = key;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  const cmp = (a,b) => key==='cpv' ? a.cpv-b.cpv : key==='scpv' ? a.scpv-b.scpv : (a.price||0)-(b.price||0);
  render([...dataExisting].sort(cmp), [...dataNew].sort(cmp));
}

render([...dataExisting].sort((a,b)=>a.cpv-b.cpv), [...dataNew].sort((a,b)=>a.cpv-b.cpv));
</script>
</body>
</html>
