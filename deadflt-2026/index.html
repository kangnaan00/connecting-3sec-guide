<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEADFLT 인플루언서 캠페인 결과</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;600;700&display=swap">
<style>
  :root { --c: #4a8c00; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #fff; color: #111;
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    font-size: 15px;
    padding-inline: max(20px, env(safe-area-inset-left,0px)) max(20px, env(safe-area-inset-right,0px));
    padding-block: 40px 64px;
  }
  .wrap { max-width: 1300px; margin-inline: auto; }
  .brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(52px, 15vw, 88px);
    font-weight: 400; letter-spacing: 0.04em;
    color: var(--c); line-height: 1; display: block; margin-bottom: 6px;
  }
  .tagline { font-size: 14px; font-weight: 600; color: #111; margin-bottom: 32px; }
  .section-title { font-size: 13px; font-weight: 700; letter-spacing: 0.10em; text-transform: uppercase; color: #111; margin-bottom: 10px; }
  .tbl-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; table-layout: fixed; min-width: 500px; }
  col.c-num  { width: 36px; }
  col.c-id   { width: 180px; }
  col.c-ch   { width: 60px; }
  col.c-date { width: 64px; }
  col.c-view { width: 100px; }
  thead tr { border-bottom: 2px solid #111; }
  th { padding: 9px 10px; font-size: 12px; letter-spacing: 0.07em; text-transform: uppercase; color: #111; font-weight: 700; text-align: right; white-space: nowrap; }
  th:nth-child(-n+3) { text-align: left; }
  td { padding: 11px 10px 11px; border-bottom: 1px solid #e8e8e8; font-size: 14px; text-align: right; color: #111; vertical-align: middle; white-space: nowrap; }
  td:nth-child(-n+3) { text-align: left; }
  td.id { white-space: normal; font-weight: 700; }
  .lk a { color: #111; text-decoration: none; font-size: 13px; font-weight: 600; }
  .lk a:hover { color: var(--c); }
  .nv { color: var(--c); font-weight: 700; }
  .ns { font-weight: 700; }
  .na { color: #bbb; font-size: 12px; }
  tfoot td { padding: 13px 10px; border-top: 2px solid #111; border-bottom: none; font-size: 18px; font-weight: 700; text-align: right; color: #111; }
  tfoot td:nth-child(-n+3) { text-align: left; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="wrap">

  <span class="brand">DEADFLT</span>
  <p class="tagline">인플루언서 캠페인 결과 · 2026</p>

  <div class="section-title">계정별 수치</div>
  <div class="tbl-wrap">
  <table>
    <colgroup>
      <col class="c-num"><col class="c-id"><col class="c-ch">
      <col class="c-date"><col class="c-view">
    </colgroup>
    <thead>
      <tr>
        <th>#</th><th>아이디</th><th>링크</th>
        <th>업로드일</th><th>조회수</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="3">합계</td><td></td>
        <td class="nv">—</td>
      </tr>
    </tfoot>
  </table>
  </div>

</div>
</body>
</html>
